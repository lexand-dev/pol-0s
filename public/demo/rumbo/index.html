<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rumbo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; background: #eef6ff; min-height: 100vh; padding: 48px 6vw; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #5ad0ff, #0a6cff); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; }
  .aviso { font-size: 13px; color: #6b6b72; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); }
  .card b { display: block; font-size: 17px; margin-bottom: 6px; }
  .card span { color: #6b6b72; font-size: 14px; }
</style></head>
<body>
  <header><div class="logo">R</div><div><h1>Rumbo</h1><p class="aviso">Página de demostración de la plantilla: cámbiala o bórrala.</p></div></header>
  <div class="grid"><div class="card"><b>Día 1 · Lisboa</b><span>Llegada, Alfama y mirador de Santa Lucía</span></div><div class="card"><b>Día 2 · Sintra</b><span>Palacio da Pena y Quinta da Regaleira</span></div><div class="card"><b>Día 3 · Belém</b><span>Torre, monasterio y pasteles</span></div><div class="card"><b>Reservas</b><span>Hotel, tren y dos museos</span></div><div class="card"><b>Gastos</b><span>312 € de 400 € previstos</span></div></div>
</body></html>
